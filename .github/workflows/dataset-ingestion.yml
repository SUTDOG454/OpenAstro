name: Dataset ingestion validation

on:
  pull_request:
    paths:
      - "data/extractions/open-astrology-datasets/**"
      - "tools/ingest_astrodatabank.py"
      - "tools/validate_open_astrology_dataset.py"
      - "docs/astrodatabank-ingestion.md"
      - ".github/workflows/dataset-ingestion.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "data/extractions/open-astrology-datasets/**"
      - "tools/ingest_astrodatabank.py"
      - "tools/validate_open_astrology_dataset.py"
      - "docs/astrodatabank-ingestion.md"
      - ".github/workflows/dataset-ingestion.yml"

permissions:
  contents: read

concurrency:
  group: dataset-ingestion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source extract and ingestion utility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile ingestion tools
        run: python -m py_compile tools/ingest_astrodatabank.py tools/validate_open_astrology_dataset.py

      - name: Validate checked-in dataset
        run: python tools/validate_open_astrology_dataset.py

      - name: Run ingestion tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate JSON manifests
        run: python -m json.tool data/extractions/open-astrology-datasets/manifest.json >/dev/null

      - name: Check patch whitespace
        run: git diff --check "${{ github.event.before }}" "${{ github.sha }}"
